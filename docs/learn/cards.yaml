- id: candidate-line-0019
  question: "Why does an escalation go through a queue and a worker thread instead of posting from the turn, and what happens when Slack is down or the queue is full?"
  answer: "Posting from the turn would turn a three-second Slack hiccup into three seconds of silence on the phone. submit puts the escalation on a queue of 100 without waiting; one worker thread writes the escalation row to the trace store, posts, and records the post time or the error, so a failed post is written against the call and never raised into a turn. A full queue drops and counts rather than blocks, because an unbounded one would grow memory all day behind a dead webhook, and drain lets text mode and the eval runner wait for the last post before they exit."
  say_it: "A slow channel must never slow a caller, so a hand-off goes on a bounded queue and a worker posts it, and a failure is written against the call, never raised into the turn."
  ref: "candidate_line/escalation.py:99"
  source: "review 2026-11-03"
  box: 0
  next_due: 2026-11-04
