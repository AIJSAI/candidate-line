- id: candidate-line-0014
  question: "What did the bake-off measure for each arm's median turn and for arm B's cost per five-minute call, and how was each number taken?"
  answer: "The probe caller dialled the same fifteen cases into each arm on 2026-11-02, both arms on the same persona, every call recorded dual-channel on Twilio, and the gap from the caller's last word to the reply read from the recording by energy (RMS over 500, a 300 ms hangover). Arm A's median was 2,060 ms (23 turns, 16 calls) and arm B's 1,360 ms (41 turns, 19 calls), so B was 700 ms faster, and the probe's own clock agreed at 669 ms. Arm B cost about 0.10 USD per five-minute call: Nova 2.5 Sonic at 0.057 from its own usageEvent token counts over three dialled calls, priced at the Price List rates read 2026-11-01, plus Twilio at 0.04, against about 0.18 for arm A. The rule fired for B on all three counts, and arm A is still the build because only A can check a sentence before it becomes audio."
  say_it: "I wrote the rule before I measured, so when B won on speed and cost I said so, and I kept A because only A lets me check a sentence before the caller hears it."
  ref: "docs/decisions/DR-001-voice-path.md:63"
  source: "review 2026-11-03"
