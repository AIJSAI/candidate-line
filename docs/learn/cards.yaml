- id: candidate-line-0013
  question: "Why do the candidates and slots come from a seeded script and not from a model, and how do you know they never drift?"
  answer: "scripts/make_synthetic_data.py with seed 20261101 writes candidates.yaml, slots.yaml and baseline_invites.csv, and a test regenerates them into a temporary folder and compares them exactly, so an eval case that names a slot id or a code means the same thing next week. A model run twice gives different codes and slots and every case would float; only the FAQ prose came from a model, written once from the committed data/PROMPT.md (with one hand edit to F3.2 and F8.1 on 2026-11-03, noted in that file), and its section ids are what Gus cites. No fixture holds anything that could evaluate or reach a person: no scores, notes, phone numbers or emails, and every file says it is synthetic in its first line."
  say_it: "An eval case has to mean the same thing next week, so the fixtures come from one seed and a test regenerates them, and nothing in them could be used to judge a person."
