- id: candidate-line-0015
  question: "Why keep dated text copies of vendor pages in docs/refs instead of links, and what do you do before quoting one in the room?"
  answer: "Every rate, quota, model id and protocol fact a record relies on comes from a page saved as text with its read date in the file name, because vendor pages change and a link shows today's version, not the one the decision used. Saved pages settled real choices: the Polly API page lists mulaw at 8000 Hz as an output format, so no codec sits between Polly and the phone, and the Twilio security page's worked example is the unit test of the signature check. Before a fact is said aloud the page is re-read if its date is older than the day, and the date is said with it; everything in docs/refs was read on 2026-11-01."
  say_it: "Vendor pages change and memory is not a source, so every number I say in the room has a dated saved page behind it."
  ref: "docs/refs/README.md:3"
