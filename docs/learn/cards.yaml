- id: candidate-line-0017
  question: "How does the probe caller measure a turn gap, and how do its numbers compare with the line's own log and the call recording?"
  answer: "The probe plays Twilio's side of the stream and times the silence from its own last audio frame to the first audio from Gus after it; audio that arrives while the probe is still speaking is the tail of the last reply and never starts a gap. Straight into the local line on the echo brain it gave 740 to 780 ms medians over three runs of two replies on 2026-11-01, the cascaded path's floor with no model. On one dialled arm A call the three clocks read: the line's log 1,070 and 864 ms (final transcript to first byte sent), the probe 1,900 ms median (both phone legs), and the recording 1,740 ms, so the phone network adds roughly 800 ms around the line. Each number is reported with its method, and two clocks that disagree are a finding."
  say_it: "Each clock leaves out a different part of the trip, so I time the same turn from the line's log, the probe and the call recording; the phone network alone adds about 800 ms."
  ref: "candidate_line/probe/session.py:144"
  source: "review 2026-11-03"
  box: 0
  next_due: 2026-11-04
