- id: candidate-line-0009
  question: "Your webhook is a public URL on a tunnel whose hostname changes at every start. How do you know a POST to /voice came from Twilio, and what happens when the auth token is missing?"
  answer: "Every POST is checked against Twilio's signature: HMAC-SHA1 over the public URL followed by the form fields sorted by name, keyed with the auth token and compared in constant time; a mismatch is a 403. Behind the tunnel the app sees 127.0.0.1, so the URL it checks is rebuilt from PUBLIC_BASE_URL. It fails closed: with no TWILIO_AUTH_TOKEN the webhook answers 503 unless ALLOW_UNSIGNED_WEBHOOKS=1, which is for a local curl, and Twilio's own worked example is a unit test, which is why six lines beat the helper library. The first real call showed it live: an unsigned request two minutes before got 403 and Twilio's signed POST got 200."
  say_it: "The webhook is a public URL, so every request proves it came from Twilio or is refused, and a missing token shuts the door instead of opening it."
  ref: "candidate_line/telephony/app.py:115"
  source: "review 2026-11-03"
  box: 0
  next_due: 2026-11-04
  history: []
- id: candidate-line-0010
  question: "How long does the line wait after a final transcript before it runs the turn, and how did you arrive at those numbers?"
  answer: "300 ms when the final ends in a question or exclamation mark, 600 ms otherwise, with a 2,000 ms backstop if a partial never becomes a final. They came from dialled probe calls on 2026-11-02 with every partial logged with its time: at 300 ms, then at 800 ms after a full stop, the turn still split, because the next sentence's first partial reached the line 1,234 ms after the previous final. A grace that long on every statement is a slow Gus, so the grace stayed short and a turn whose reply is still being made when the caller goes on is superseded. The third dialled call, at 20:06 CT on 300 and 600, answered the joined question once, at a recording gap of 3,060 ms."
  say_it: "A pause between two sentences is not the end of a turn, so Gus waits a beat after a statement, less after a question, and drops any reply the caller talks past."
  ref: "candidate_line/telephony/media.py:45"
  source: "review 2026-11-03"
