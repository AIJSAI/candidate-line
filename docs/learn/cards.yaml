- id: candidate-line-0012
  question: "Why four named hooks that return a replacement, rather than one on_message hook with a mode flag, or a guard that raises to stop the turn?"
  answer: "The guard and the observer need different moments: on_turn sees the caller's words before the brain, before_speak sees Gus's words before the caller, on_silence is told how long the caller has been quiet, and on_tool sees a tool call after it ran; four names say which moment where a flag would need a document. A hook that raises leaves the caller in silence, while one that returns a replacement leaves a sentence, and an empty string means say nothing, which is how the guard and the kill switch act. before_speak runs once per turn on the whole reply inside run_turn (the record first said per sentence and was amended), and the history keeps what the caller heard, not what the model wrote."
  say_it: "A rule has to hold on the phone, in text and in the evals at once, so there is one turn function with four named hooks that hand back a sentence, never an exception."
  ref: "candidate_line/turn.py:70"
  source: "review 2026-11-03"
  box: 0
  next_due: 2026-11-04
