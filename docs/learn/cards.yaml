- id: candidate-line-0001
  question: "Why does the brain sit behind one protocol chosen by an environment variable, and what triggered it?"
  answer: "This account's Bedrock quota for Haiku 5.5 and Sonnet 5.5 was zero on 2026-11-01 and stayed zero after the increase cases closed, while Haiku 4.5 opened. Bedrock Converse and the Anthropic Messages API both return the same Reply, so the turn loop, the evals and the traces never know which ran. The switch rule in DR-003 is therefore one variable, decided Monday about 13:00 CT (DR-003's update line)."
  say_it: "I put the model behind one interface so the provider is a config value, because the platform decision held but the account's quota did not."
  ref: "candidate_line/brain/provider.py:295"
