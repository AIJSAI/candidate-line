- id: candidate-line-0011
  question: "Why run AWS's Nova Sonic sample unmodified as its own Node process instead of porting it into your Python app, and how can anyone check the as-is claim?"
  answer: "A Python port needs AWS's experimental bidirectional-stream client rather than boto3, a week's risk for a measurement that needed one evening, and vendoring the sample would make its MIT-0 code and lockfile this repository's. It sits beside the repository pinned at commit 2d441b34c380, and pointing the Twilio webhook at its tunnel or at the line's selects the arm. Every change is in bakeoff/arm-b-settings.patch, a git diff of its src/: the bake-off persona word for word, the model id moved to amazon.nova-2-5-sonic, the Say preamble that named the vendor removed so both arms start the same way, and one log line that prints Sonic's usageEvent token counts for the cost rule."
  say_it: "A port would have cost a week for a measurement that needed an evening, so I ran the speech-to-speech arm as AWS ships it, with every change in one patch anyone can read."
  ref: "bakeoff/arm-b-settings.patch:10"
