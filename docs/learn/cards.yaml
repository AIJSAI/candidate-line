- id: candidate-line-0005
  question: "When a turn is superseded on the phone, what is thrown away, what is kept, and what can it not undo?"
  answer: "The reply is never spoken, the history is cut back to where the turn began, and the caller's words are carried to lead the next turn, so one whole question is answered once. A tool that already ran inside that turn stays done, and what it wrote into ctx.data stays. That is why card 04's open decision defaults to booking only after the caller confirms aloud: a superseded turn then books nothing."
  say_it: "A reply the caller talked over is thrown away and their words carried forward, but a tool that already ran stays done, so a booking waits for a spoken yes."
  ref: "candidate_line/telephony/media.py:247"
  source: "receipt 2026-11-02"
  box: 0
  next_due: 2026-11-03
  history: []
- id: candidate-line-0006
  question: "Where does the prompt-cache mark sit, and what does the cost line do with cached tokens?"
  answer: "On the system prompt of the Anthropic request only, as cache_control ephemeral, because the persona and the FAQ are the same on every turn and a tool turn sends them twice; the Converse request sets no cache point and only reads the counters. Below the model's minimum cacheable size the mark does nothing (the 21:30 smoke cached nothing). The cost line prices cache reads at a tenth of the input rate and cache writes at 1.25 times, and make eval prints both."
  say_it: "The persona and FAQ never change between turns and a tool turn sends them twice, so I mark them for the prompt cache and the cost line prices what the cache serves at a tenth."
  ref: "candidate_line/brain/provider.py:230"
  source: "receipt 2026-11-02"
