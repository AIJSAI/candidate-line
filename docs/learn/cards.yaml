- id: candidate-line-0002
  question: "Where does barge-in happen, and what counts as barge-in today?"
  answer: "In the media session's listener: a partial transcript with words while Gus is speaking sends a clear message, which empties Twilio's buffer, and sets a flag that drops the remaining sentences. Gus counts as speaking from the first media chunk until Twilio returns the last mark. Energy on the inbound audio was rejected because breath and line noise would fire it."
  say_it: "Barge-in is a transcript event, not a volume event: words from the caller while Gus is talking clear Twilio's buffer and stop the rest of the reply."
  ref: "candidate_line/telephony/media.py:97"
  source: "receipt 2026-11-01"
  box: 0
  next_due: 2026-11-02
  history: []
- id: candidate-line-0003
  question: "Why is the caller's number masked inside the trace store rather than at the webhook?"
  answer: "The store is the only writer. start_call is the one function that accepts a number and it keeps the last four digits before the row is written, so no span can carry a number by accident. A span handed bytes is refused, so audio never lands in the store either."
  say_it: "I mask at the single chokepoint that writes, because two writers each have to remember and one cannot forget."
  ref: "candidate_line/traces/store.py:110"
  source: "receipt 2026-11-01"
  box: 0
  next_due: 2026-11-02
  history: []
- id: candidate-line-0004
  question: "Why is thinking turned off on the live turn, and what did the measurement show?"
  answer: "Haiku 5.5 thinks by default. With adaptive thinking on and a 120-token cap, three of five Gus-sized replies came back with no text because the thinking spent the output budget; on a phone line that is a silent Gus. Thinking off with effort low gave a reply every time, and the turn's latency tracked output tokens, not the model: a 60-token cap gave a 901 ms median."
  say_it: "I turned thinking off because the caller is waiting and the measurement showed thinking eating the reply budget; the latency lever on a phone line is how many tokens Gus speaks."
  ref: "candidate_line/brain/provider.py:100"
  source: "DR-003 evidence 2026-11-02"
