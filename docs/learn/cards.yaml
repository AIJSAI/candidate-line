  question: "How long do the seven prompt cards take, how was that measured, and what does the number leave out?"
  answer: "Each card was pasted, as the room will paste it, into a fresh coding agent (Claude Code's agent runtime on Opus 5.5) in a detached scratch worktree, with the session's draft answers standing in for James's and no approval pauses, and timed by wall clock; the worktree was discarded and only the defect list came into the repository. With the plumbing fixed, a card is 3 to 15 minutes of tool time (01 3, 02 10, 03 8, 04 15, 05 9, 06 14, 07 9), about 68 minutes end to end. That is tool time alone: the questions, the approvals, the reading aloud and the phone calls come on top, so in a 60-minute room the cut list is applied before the clock starts and card 04 is the one to protect. Every defect that mattered was in the pre-built plumbing, the worst a PIN read aloud because the brain had no tool channel."
