- id: candidate-line-0016
  question: "Why does the eval runner pass or fail on regular expressions with a model judge only as a spot check, and what does it do with a check whose component is not built yet?"
  answer: "A model judge is the thing being tested, so it shares the blind spots it should catch; the bar is checks with no model in the loop: patterns over what the brain heard and what the caller heard, the guard's lexicon, and a cited section id, and a case's judge question never passes or fails it. tool_called, state and tier read fields on TurnResult that the tool loop and the tier rule fill, and None means not landed, so the verdict is pending: it names the check and the card that lands it, never counts as a pass, and does not fail the gate. It began as a failure, and card 02's dry run showed make gate then could not be green from card 02 until card 06, against AGENTS.md rule 8."
  say_it: "The model is what I am testing, so it cannot be the judge of record: my evals pass or fail on checks anyone can read, and a check for a part not built yet says pending, never green."
  ref: "candidate_line/evals/checks.py:54"
