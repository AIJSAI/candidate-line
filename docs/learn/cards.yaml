- id: candidate-line-0002
  question: "Where does barge-in happen, and what counts as barge-in today?"
  answer: "In the media session's listener: a partial transcript with words while Gus is speaking sends a clear message, which empties Twilio's buffer, and sets a flag that drops the remaining sentences. Gus counts as speaking from the first media chunk until Twilio returns the last mark. Energy on the inbound audio was rejected because breath and line noise would fire it."
  say_it: "Barge-in is a transcript event, not a volume event: words from the caller while Gus is talking clear Twilio's buffer and stop the rest of the reply."
  ref: "candidate_line/telephony/media.py:183"
  source: "receipt 2026-11-01"
