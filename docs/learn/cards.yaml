- id: candidate-line-0007
  question: "On the phone, when does the on_silence hook fire, and when does its clock start?"
  answer: "A watcher task checks every 250 ms. When Gus is not speaking or thinking, no final transcript is waiting and no hang-up is set, and six seconds have passed since the caller's last words or since Twilio returned Gus's last mark, it runs the hook and speaks its line, then waits another six seconds. Before the dry run of card 06 the phone never called the hook, so a holding line could only play once the caller spoke."
  say_it: "The phone keeps its own silence clock, starting when Gus finishes rather than when he starts, so a holding line plays even when the caller says nothing."
  ref: "candidate_line/telephony/media.py:161"
  source: "receipt 2026-11-02"
