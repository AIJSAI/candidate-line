- id: candidate-line-0018
  question: "Why keep traces in one SQLite file rather than an OpenTelemetry collector or JSON lines?"
  answer: "The room needs a list of calls and a recruiter's reply that updates a row, not a span waterfall. A collector or a hosted tracing product means a new account and a new secret, and the recruiter's page would be a vendor's; an export can be added later as a span sink without changing a writer. JSON lines suit spans but make the list view read every line for one call's totals and cannot update the escalation row the reply closes. So var/traces.sqlite holds three tables, calls, spans and escalations, with no server and ignored by git, and since card 03's dry run each path opens its own store, so make eval cannot bury the room's call."
  say_it: "The room needs a list of calls and a reply that updates a row, so traces live in one SQLite file with three tables, and a vendor exporter can come later without touching a writer."
  ref: "candidate_line/traces/store.py:44"
  source: "review 2026-11-03"
  box: 0
  next_due: 2026-11-04
