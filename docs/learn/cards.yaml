- id: candidate-line-0008
  question: "Why does the CLI hold no long-lived key, what are the two profiles, and what did the first call after the switch teach?"
  answer: "The May admin key in ~/.aws/credentials was replaced by IAM Identity Center: profile candidate-line is the CandidateLineBuilder permission set (an 8-hour session, Bedrock, Transcribe, Polly, budgets and quotas, no IAM writes), and candidate-line-admin is AdministratorAccess for one hour, used as a visible choice. The key went inactive at 15:46 CT and was deleted at 22:25 CT on 2026-11-02, and the credentials file was removed. The first call after the switch was silent because the Transcribe streaming SDK has its own credential chain that cannot read an Identity Center profile, so the transcriber now borrows boto3's credentials at every start."
  say_it: "I replaced a permanent admin key with Identity Center and two roles, a narrow daily one and a one-hour break-glass, and the one SDK with its own credential chain told me so with a silent call, which I fixed in one function."
