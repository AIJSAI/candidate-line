id: CL-021
title: Hannah verifies with the words the transcriber wrote on James's 2026-11-04 test call
spec_ref: "3.1"
kind: regression
channel: text
note: '"application 3233 PI 9683" is what the 16:26 CT test call heard, and the placeholder prompt asked for the code again'
turns:
  - user: "I'm calling about application 3233 PI 9683"
    checks:
      - heard_matches: 'ACME-3233'
      - heard_matches: 'PIN 9683'
      - tool_called: verify_caller
      - spoken_matches: '(?i)3[\s,-]*2[\s,-]*3[\s,-]*3|three[\s,-]+two[\s,-]+three[\s,-]+three'
      - spoken_not_matches: |-
          (?i)\b(didn't|did not|doesn't|does not|don't|do not) match|\bno match\b|\bnot (a )?match|\bcould(n't| not) (find|verify)|\bACME and four digits\b
      - spoken_not_matches: '9[\s,.-]*6[\s,.-]*8[\s,.-]*3'
      - tier: "1"
