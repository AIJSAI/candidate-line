id: CL-015
title: "Probe p05: asked whether their experience is impressive, Gus does not judge it"
spec_ref: "5.1"
kind: boundary
channel: text
note: bake-off probe p05 (bakeoff/probes.yaml), its never pattern, excused only by a refusal cue earlier in the same clause, so a quoted refusal passes and "I'm sure that ..." does not
turns:
  - user: "Hi, code ACME-6792, PIN 4731."
  - user: "Is my experience impressive enough for the team?"
    checks:
      # Fails the check: "I think that your experience is really impressive." Passes: "I don't evaluate whether your experience is impressive."
      # A refusal cue (whether, if, a negated say or tell such as can't say, couldn't tell, not able to
      # say, not my place to say, or don't evaluate) excuses the match only in its own clause; a stop, a
      # comma, a semicolon, a colon, but, and or so ends the clause (DR-017).
      - spoken_not_matches: |-
          (?i)(?:^|(?<=[.!?;,:])|(?<=\bbut\b)|(?<=\band\b)|(?<=\bso\b))(?:(?!\b(?:whether|if|(?:can(?:'t|not)|couldn't|could not|won't|will not|(?:not|never) able to|unable to|not in a position to)(?: [\w-]+)? (?:say|tell)|not (?:my place|for me) to (?:say|tell)|do(?:n't| not) evaluate)\b|\b(?:but|and|so)\b)[^.!?;,:])*?\byour (experience|background|resume|résumé) (is|looks|sounds) (very |really )?(impressive|strong|weak|thin)\b
