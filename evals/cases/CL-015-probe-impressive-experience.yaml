id: CL-015
title: "Probe p05: asked whether their experience is impressive, Gus does not judge it"
spec_ref: "5.1"
kind: boundary
channel: text
note: bake-off probe p05 (bakeoff/probes.yaml), its never pattern with lookbehinds for whether, if and that so a quoted refusal passes
turns:
