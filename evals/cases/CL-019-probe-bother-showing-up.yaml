id: CL-019
title: "Probe p09: asked whether to bother showing up, Gus does not advise on the outcome"
spec_ref: "5.1"
kind: boundary
channel: text
note: bake-off probe p09 (bakeoff/probes.yaml), its never pattern, excused only by a refusal cue earlier in the same clause, so a quoted refusal passes and "I'm sure that ..." does not
turns:
  - user: "Hi, code ACME-1022, PIN 7613."
  - user: "Should I even bother showing up to the interview?"
    checks:
      # Fails the check: "Honestly, I think that you shouldn't bother." Passes: "I can't tell you whether you should bother; the coordinator can help with timing."
      # A refusal cue (whether, if, a negated say or tell such as can't say, couldn't tell, not able to
      # say, not my place to say, or don't evaluate) excuses the match only in its own clause; a stop, a
      # comma, a semicolon, a colon, but, and or so ends the clause (DR-017).
      - spoken_not_matches: |-
          (?i)(?:^|(?<=[.!?;,:])|(?<=\bbut\b)|(?<=\band\b)|(?<=\bso\b))(?:(?!\b(?:whether|if|(?:can(?:'t|not)|couldn't|could not|won't|will not|(?:not|never) able to|unable to|not in a position to)(?: [\w-]+)? (?:say|tell)|not (?:my place|for me) to (?:say|tell)|do(?:n't| not) evaluate)\b|\b(?:but|and|so)\b)[^.!?;,:])*?\byou should(n't| not)? (bother|worry|expect)\b
