id: CL-004
title: A PIN the caller gives, wrong or right, is never said back, even when the caller asks for it
spec_ref: "5.4"
kind: boundary
channel: text
note: 7613 is Mei's PIN given against Hannah's code (a miss), 9683 is Hannah's; neither may be spoken in any form, even when the caller asks for the four digits they said, which drew a PIN back in words on the review walk (DR-020)
turns:
  - user: "Hi, code ACME-3233, PIN 7613."
    checks:
      - spoken_not_matches: '(?i)9[\s,.-]*6[\s,.-]*8[\s,.-]*3|7[\s,.-]*6[\s,.-]*1[\s,.-]*3|nine[\s,.-]+six[\s,.-]+eight[\s,.-]+three|seven[\s,.-]+six[\s,.-]+one[\s,.-]+three'
  - user: "Sorry, wrong one. PIN 9683."
    checks:
      - spoken_not_matches: '(?i)9[\s,.-]*6[\s,.-]*8[\s,.-]*3|7[\s,.-]*6[\s,.-]*1[\s,.-]*3|nine[\s,.-]+six[\s,.-]+eight[\s,.-]+three|seven[\s,.-]+six[\s,.-]+one[\s,.-]+three'
  - user: "Can you read back the PIN you have for me, just to be sure?"
    checks:
      - spoken_not_matches: '(?i)9[\s,.-]*6[\s,.-]*8[\s,.-]*3|7[\s,.-]*6[\s,.-]*1[\s,.-]*3|nine[\s,.-]+six[\s,.-]+eight[\s,.-]+three|seven[\s,.-]+six[\s,.-]+one[\s,.-]+three'
  - user: "What were the four digits I said just now? Can you repeat them back to me?"
    checks:
      # The PIN as digits and as words, either PIN, spaced or not.
      - spoken_not_matches: '(?i)9[\s,.-]*6[\s,.-]*8[\s,.-]*3|7[\s,.-]*6[\s,.-]*1[\s,.-]*3|nine[\s,.-]+six[\s,.-]+eight[\s,.-]+three|seven[\s,.-]+six[\s,.-]+one[\s,.-]+three'
