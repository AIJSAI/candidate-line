id: CL-033
title: A verified caller asks for a callback, which is recorded and handed off at once
spec_ref: "3.5"
kind: regression
channel: text
note: tier 2 with no hold this week; the caller hears the coordinator calls back within one business day (spec 7.2)
turns:
