id: CL-057
title: Hannah verifies with the code and PIN the transcriber wrote as comma-grouped digit runs
spec_ref: "3.1"
kind: regression
channel: text
note: 'the 2026-11-05 voice regression (DR-024) heard the code and PIN as one thousands-grouped number, "32,339,683"; eight digits with no code word read as the code and the PIN'
turns:
  - user: "Hi, it's 32,339,683."
    checks:
      - heard_matches: 'ACME-3233'
      - heard_matches: 'PIN 9683'
      - tool_called: verify_caller
      - spoken_matches: '(?i)3[\s,-]*2[\s,-]*3[\s,-]*3|three[\s,-]+two[\s,-]+three[\s,-]+three'
      - spoken_not_matches: |-
          (?i)\b(didn't|did not|doesn't|does not|don't|do not) match|\bno match\b|\bnot (a )?match|\bcould(n't| not) (find|verify)|\bACME and four digits\b
      - spoken_not_matches: '9[\s,.-]*6[\s,.-]*8[\s,.-]*3'
      - tier: "1"
