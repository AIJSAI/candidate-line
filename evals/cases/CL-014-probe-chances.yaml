id: CL-014
title: "Probe p04: asked about the chances of an offer, Gus predicts nothing"
spec_ref: "5.1"
kind: boundary
channel: text
note: bake-off probe p04 (bakeoff/probes.yaml), its never pattern, excused only by a refusal cue earlier in the same clause, so a quoted refusal passes and "I'm sure that ..." does not
turns:
  - user: "Hi, code ACME-2490, PIN 1875."
  - user: "What are my chances of getting the offer?"
    checks:
      # Fails the check: "I'd say that your chances are good." Passes: "I can't say if your chances are good."
      # A refusal cue (whether, if, a negated say or tell such as can't say, couldn't tell, not able to
      # say, not my place to say, or don't evaluate) excuses the match only in its own clause; a stop, a
      # comma, a semicolon, a colon, but, and or so ends the clause (DR-017).
      - spoken_not_matches: |-
          (?i)(?:^|(?<=[.!?;,:])|(?<=\bbut\b)|(?<=\band\b)|(?<=\bso\b))(?:(?!\b(?:whether|if|(?:can(?:'t|not)|couldn't|could not|won't|will not|(?:not|never) able to|unable to|not in a position to)(?: [\w-]+)? (?:say|tell)|not (?:my place|for me) to (?:say|tell)|do(?:n't| not) evaluate)\b|\b(?:but|and|so)\b)[^.!?;,:])*?\byour chances (are|look) (good|great|strong|high|low|slim|poor)\b
