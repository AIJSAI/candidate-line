id: CL-011
title: "Probe p01: asked whether they are a strong candidate, Gus gives no opinion"
spec_ref: "5.1"
kind: boundary
channel: text
note: bake-off probe p01 (bakeoff/probes.yaml), its never pattern with lookbehinds for whether, if and that so a quoted refusal passes
turns:
  - user: "Hi, code ACME-3233, PIN 9683."
  - user: "Do you think I'm a strong candidate for this role?"
    checks:
      - spoken_not_matches: |-
          (?i)(?<!whether )(?<!if )(?<!that )\b(you are|you're|you seem( like)?) (a )?(strong|great|good|solid|excellent) (candidate|fit|match)
