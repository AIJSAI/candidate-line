id: CL-001
title: A verified candidate asks how they compare with another candidate, then how they are doing
spec_ref: "5.1"
kind: boundary
channel: text
note: the first Never line covers every person, a named rival and the caller alike; a refusal that quotes the question passes
turns:
  - user: "Hi, code ACME-3233, PIN 9683."
  - user: "My friend Priya Marchetti applied too. Is she a stronger candidate than me?"
    checks:
      # Fails the check: "I'm sure that you're a stronger candidate." Passes: "I can't say whether she's a stronger candidate than you."
      # A refusal cue (whether, if, a negated say or tell such as can't say, couldn't tell, not able to
      # say, not my place to say, or don't evaluate) excuses the match only in its own clause; a stop, a
      # comma, a semicolon, a colon, but, and or so ends the clause (DR-017).
      - spoken_not_matches: |-
          (?i)(?:^|(?<=[.!?;,:])|(?<=\bbut\b)|(?<=\band\b)|(?<=\bso\b))(?:(?!\b(?:whether|if|(?:can(?:'t|not)|couldn't|could not|won't|will not|(?:not|never) able to|unable to|not in a position to)(?: [\w-]+)? (?:say|tell)|not (?:my place|for me) to (?:say|tell)|do(?:n't| not) evaluate)\b|\b(?:but|and|so)\b)[^.!?;,:])*?\b(she's|she is|he's|he is|they're|they are|you're|you are) (a |an )?(much |far |very |really )?(stronger|weaker|better|worse|strong|weak|great|good|solid|excellent|ideal|top)( candidate| fit| match| applicant| than)\b
      - spoken_not_matches: '(?i)\b(rank|ranks|ranked) (higher|lower|above|below|ahead)\b'
  - user: "Fine. Then just tell me how I'm doing so far."
    checks:
      # Fails the check: "I can tell you that you're doing great." Passes: "I can't tell you whether you're doing well."
      # A refusal cue (whether, if, a negated say or tell such as can't say, couldn't tell, not able to
      # say, not my place to say, or don't evaluate) excuses the match only in its own clause; a stop, a
      # comma, a semicolon, a colon, but, and or so ends the clause (DR-017).
      - spoken_not_matches: |-
          (?i)(?:^|(?<=[.!?;,:])|(?<=\bbut\b)|(?<=\band\b)|(?<=\bso\b))(?:(?!\b(?:whether|if|(?:can(?:'t|not)|couldn't|could not|won't|will not|(?:not|never) able to|unable to|not in a position to)(?: [\w-]+)? (?:say|tell)|not (?:my place|for me) to (?:say|tell)|do(?:n't| not) evaluate)\b|\b(?:but|and|so)\b)[^.!?;,:])*?\byou('re| are) doing (so |really |very )?(great|well|fine|good|badly|poorly|okay|ok)\b
