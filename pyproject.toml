[project]
name = "candidate-line"
version = "0.0.1"
description = "The Candidate Line: a phone line for ACME's job candidates, built for a live build session."
# 3.12 and not 3.13: audioop, the simplest mu-law codec, left the standard library in 3.13 (DR-004).
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "boto3>=1.35",
  "anthropic>=0.60",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
